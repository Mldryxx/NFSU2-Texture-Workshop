name: Build and Deploy NFSU2 Texture Workshop
on:
  push:
    branches:
      - binarius-engine-port
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-engine.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nfsu2-vinyl-preview-engine-0-3
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test DDS decoder
        working-directory: web/site
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Test native Rust engine primitives
        working-directory: web/engine
        run: cargo test --lib
      - name: Check WebAssembly target
        run: cargo check --manifest-path web/engine/Cargo.toml --target wasm32-unknown-unknown
      - name: Build WebAssembly engine
        working-directory: web/engine
        run: wasm-pack build --target web --release --out-dir ../site/pkg
      - name: Verify WebAssembly exports
        run: |
          test -s web/site/pkg/nfsu2_web_engine.js
          test -s web/site/pkg/nfsu2_web_engine_bg.wasm
          grep -q 'nfsu2_engine_version' web/site/pkg/nfsu2_web_engine.js
          grep -q 'list_car_textures' web/site/pkg/nfsu2_web_engine.js
          grep -q 'decode_car_texture' web/site/pkg/nfsu2_web_engine.js
          grep -q 'replace_car_texture_with_status' web/site/pkg/nfsu2_web_engine.js
          grep -q 'replace_car_texture_pair_with_status' web/site/pkg/nfsu2_web_engine.js
      - name: Upload downloadable web app
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Texture-Workshop-Web
          path: web/site/
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
